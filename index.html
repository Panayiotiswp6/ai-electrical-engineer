<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Electrical Engineer</title>
</head>

<body>

<h1>⚡ AI Electrical Engineer</h1>

<p>Welcome to my first AI engineering project.</p>


<!-- OHM'S LAW CALCULATOR -->

<h2>🔌 Ohm's Law Calculator</h2>

<label>Voltage (V):</label>
<input type="number" id="voltage">

<br><br>

<label>Resistance (Ω):</label>
<input type="number" id="resistance">

<br><br>

<button onclick="calculateCurrent()">
Calculate Current
</button>

<h3 id="currentResult"></h3>


<!-- POWER CALCULATOR -->

<h2>🔋 Power Calculator</h2>

<label>Voltage (V):</label>
<input type="number" id="powerVoltage">

<br><br>

<label>Current (A):</label>
<input type="number" id="powerCurrent">

<br><br>

<button onclick="calculatePower()">
Calculate Power
</button>

<h3 id="powerResult"></h3>


<!-- RESISTOR CALCULATOR -->

<h2>📐 Resistor Calculator</h2>

<button>
Resistor Calculator
</button>


<!-- AI ASSISTANT -->

<h2>🤖 AI Engineering Assistant</h2>

<p>Ask an electrical engineering question.</p>


<!-- JAVASCRIPT -->

<script>

function calculateCurrent() {

const voltage =
Number(document.getElementById("voltage").value);

const resistance =
Number(document.getElementById("resistance").value);

if (voltage === 0 || resistance === 0) {

document.getElementById("currentResult").innerText =
"Please enter voltage and resistance.";

return;
}

const current = voltage / resistance;

document.getElementById("currentResult").innerText =
"Current = " + current + " A";
}


function calculatePower() {

const voltage =
Number(document.getElementById("powerVoltage").value);

const current =
Number(document.getElementById("powerCurrent").value);

if (voltage === 0 || current === 0) {

document.getElementById("powerResult").innerText =
"Please enter voltage and current.";

return;
}

const power = voltage * current;

document.getElementById("powerResult").innerText =
"Power = " + power + " W";
}

</script>

</body>

</html>
